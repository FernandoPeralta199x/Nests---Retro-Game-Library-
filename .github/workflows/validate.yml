name: Validate NESTS

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate central catalog
        run: python tools/validate_catalog.py catalogs/stable.json
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python tools
        run: python -m compileall -q tools tests
